name: Build

on:
  push:
    branches:
      - hexos
    tags:
      - 'v*'
  pull_request:
    branches:
      - hexos

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_DIR: builducrt64
  # Azure Artifact Signing client, the one the HexOS Imager release uses.
  SIGNING_CLIENT_VERSION: '1.0.60'

jobs:
  build:
    name: UCRT64
    runs-on: windows-2022
    # v* tags sign with Eshtek's Azure Artifact Signing account. The release
    # environment only admits v* tags, and its federated credential
    # (repo:eshtek/vd_agent:environment:release) is the only way to a token,
    # so no other ref can sign. Everything else builds unsigned.
    environment: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && 'release' || '' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      is-release: ${{ steps.meta.outputs.is-release }}
    steps:
      - name: Disable core.autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0

      - name: Restore annotated tags
        run: git fetch --force --tags origin

      - name: Assert a clean worktree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git status --porcelain --untracked-files=no
          $dirty = git status --porcelain --untracked-files=no
          if ($dirty) {
            git diff --stat
            throw 'Worktree is dirty; git-version-gen would emit a -dirty MSI version.'
          }

      - name: Resolve build metadata
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isRelease = $env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -like 'v*'
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $isRelease = $false
          }
          "is-release=$($isRelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "is-release=$isRelease ref=$env:GITHUB_REF"

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            autotools
            autoconf-archive
            git
            make
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-msitools
            mingw-w64-ucrt-x86_64-imagemagick

      - name: Bootstrap Autotools
        shell: msys2 {0}
        run: autoreconf -i

      - name: Configure, build, and test
        shell: msys2 {0}
        run: bash msys2/build.sh "$BUILD_DIR"

      - name: Azure login
        if: steps.meta.outputs.is-release == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup NuGet
        if: steps.meta.outputs.is-release == 'true'
        uses: nuget/setup-nuget@v4

      # signtool and the signing dlib must sit at paths with no spaces.
      - name: Stage signing toolchain
        if: steps.meta.outputs.is-release == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path C:\signing | Out-Null
          nuget install Microsoft.Trusted.Signing.Client `
            -Version $env:SIGNING_CLIENT_VERSION `
            -OutputDirectory C:\signing `
            -ExcludeVersion
          $sdkSigntool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $sdkSigntool) { throw 'signtool.exe not found in the Windows SDK' }
          New-Item -ItemType Directory -Force -Path C:\signing\signtool | Out-Null
          Copy-Item "$($sdkSigntool.Directory)\*" C:\signing\signtool\ -Recurse -Force
          @{
            Endpoint               = 'https://wus2.codesigning.azure.net/'
            CodeSigningAccountName = 'eshtek-signing'
            CertificateProfileName = '${{ vars.AZURE_CERT_PROFILE_NAME }}'
            CorrelationId          = "vd_agent $env:GITHUB_REF_NAME"
          } | ConvertTo-Json | Set-Content -Path C:\signing\metadata.json -Encoding utf8

      - name: Sign guest binaries
        if: steps.meta.outputs.is-release == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            Join-Path $env:BUILD_DIR 'vdagent.exe'
            Join-Path $env:BUILD_DIR 'vdservice.exe'
          )
          & C:\signing\signtool\signtool.exe sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 `
            /dlib C:\signing\Microsoft.Trusted.Signing.Client\bin\x64\Azure.CodeSigning.Dlib.dll `
            /dmdf C:\signing\metadata.json @files
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed ($LASTEXITCODE)" }
          foreach ($file in $files) {
            & C:\signing\signtool\signtool.exe verify /pa /v $file
            if ($LASTEXITCODE -ne 0) { throw "signature verification failed for $file" }
          }

      - name: Package MSI
        shell: msys2 {0}
        run: bash msys2/package.sh "$BUILD_DIR"

      - name: Package source
        shell: msys2 {0}
        run: make -C "$BUILD_DIR" dist-xz

      - name: Record MSI path
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem -Path $env:BUILD_DIR -Filter 'spice-vdagent-x64-*.msi' |
            Select-Object -First 1
          if (-not $msi) { throw 'MSI not found after package.sh' }
          $rel = $msi.FullName.Substring((Get-Location).Path.Length + 1).Replace('\', '/')
          "msi-path=$rel" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "msi-name=$($msi.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "Packaged $rel"

      - name: Require packaged version to match the release tag
        if: steps.meta.outputs.is-release == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag.StartsWith('v')) { throw "Release ref '$tag' is not a v* tag." }
          $expected = $tag.Substring(1)
          $msi = Get-ChildItem -Path $env:BUILD_DIR -Filter 'spice-vdagent-x64-*.msi' |
            Select-Object -First 1
          if (-not $msi) { throw 'MSI not found after package.sh' }
          if ($msi.Name -notmatch '^spice-vdagent-x64-(.+)\.msi$') {
            throw "Unexpected MSI name: $($msi.Name)"
          }
          $packaged = $Matches[1]
          if ($packaged -ne $expected) {
            throw "Packaged version '$packaged' does not match tag '$tag' (expected '$expected')."
          }
          Write-Output "Packaged version $packaged matches tag $tag"

      - name: Inspect MSI
        shell: msys2 {0}
        run: |
          set -euo pipefail
          msi=$(ls -1 "$BUILD_DIR"/spice-vdagent-x64-*.msi)
          echo "MSI: $msi"
          if command -v msiextract >/dev/null; then
            msiextract --directory "$BUILD_DIR/msi-extract" "$msi"
            find "$BUILD_DIR/msi-extract" -type f | sort
          elif command -v 7z >/dev/null; then
            7z l "$msi"
          else
            echo "msiextract/7z not found; skipping MSI listing"
          fi

      - name: Sign MSI
        if: steps.meta.outputs.is-release == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem -Path $env:BUILD_DIR -Filter 'spice-vdagent-x64-*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'MSI not found after packaging.' }
          & C:\signing\signtool\signtool.exe sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 `
            /dlib C:\signing\Microsoft.Trusted.Signing.Client\bin\x64\Azure.CodeSigning.Dlib.dll `
            /dmdf C:\signing\metadata.json $msi.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed ($LASTEXITCODE)" }
          & C:\signing\signtool\signtool.exe verify /pa /v $msi.FullName
          if ($LASTEXITCODE -ne 0) { throw "signature verification failed for $($msi.Name)" }

      - name: Stage release files
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $pwd 'dist'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $msi = Get-ChildItem -Path $env:BUILD_DIR -Filter 'spice-vdagent-x64-*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'MSI not found after packaging.' }
          Copy-Item -LiteralPath $msi.FullName -Destination $stage
          $hash = Get-FileHash -LiteralPath $msi.FullName -Algorithm SHA256
          $sumName = "$($msi.Name).sha256"
          $sumPath = Join-Path $stage $sumName
          # LF, so sha256sum -c works on the files as downloaded
          [IO.File]::WriteAllText($sumPath, ("{0}  {1}`n" -f $hash.Hash.ToLowerInvariant(), $msi.Name))
          Write-Output "Staged $($msi.Name) sha256=$($hash.Hash.ToLowerInvariant())"
          $src = Get-ChildItem -Path $env:BUILD_DIR -Filter 'vdagent-win-*.tar.xz' | Select-Object -First 1
          if (-not $src) { throw 'Source tarball not found after make dist.' }
          Copy-Item -LiteralPath $src.FullName -Destination $stage
          $srcHash = Get-FileHash -LiteralPath $src.FullName -Algorithm SHA256
          [IO.File]::WriteAllText((Join-Path $stage "$($src.Name).sha256"),
            ("{0}  {1}`n" -f $srcHash.Hash.ToLowerInvariant(), $src.Name))
          Write-Output "Staged $($src.Name) sha256=$($srcHash.Hash.ToLowerInvariant())"
          "msi-name=$($msi.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vdagent-win-x64
          if-no-files-found: error
          path: |
            dist/spice-vdagent-x64-*.msi
            dist/spice-vdagent-x64-*.msi.sha256
            dist/vdagent-win-*.tar.xz
            dist/vdagent-win-*.tar.xz.sha256

  msvc:
    name: MSVC x64
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Disable core.autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0

      - name: Restore annotated tags
        run: git fetch --force --tags origin

      - name: Install ImageMagick
        shell: pwsh
        run: choco install --timeout 600 -y imagemagick

      - name: Configure and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build64 -A x64
          cmake --build build64 --config Release
          cmake --build build64 --config Release --target check

  fedora-mingw64:
    name: Fedora MinGW64
    runs-on: ubuntu-latest
    # Pin by digest (fedora:latest @ 2026-08-26). Bump only in a reviewed PR.
    container:
      image: fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    permissions:
      contents: read
    steps:
      - name: Install git
        run: dnf install -y git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Install toolchain and compile
        run: |
          set -eux
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --force --tags origin
          git describe --abbrev=4 --match='v*' HEAD
          dnf install -y libtool make autoconf-archive \
            mingw64-gcc-c++ mingw64-winpthreads-static
          autoreconf -if
          mingw64-configure
          mingw64-make -j"$(nproc)"

  release:
    name: GitHub Release
    needs: build
    if: needs.build.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: vdagent-win-x64
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/spice-vdagent-x64-*.msi
            dist/spice-vdagent-x64-*.msi.sha256
            dist/vdagent-win-*.tar.xz
            dist/vdagent-win-*.tar.xz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
